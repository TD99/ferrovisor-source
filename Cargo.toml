[workspace]
resolver = "3"
members = ["hypervisor"]

[package]
name = "ferrovisor-image"
version = "0.1.0"
edition = "2024"
publish = false

[build-dependencies]
bootloader = "=0.11.17"
hypervisor = { path = "hypervisor", artifact = "bin", target = "x86_64-unknown-none" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
